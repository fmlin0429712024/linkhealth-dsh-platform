name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Plugin contract self-check: every package under plugins/ must follow the
      # repo conventions (naming, dsh declaration, referenced paths, README,
      # test entry, Cordis exports). Zero-dependency — runs on fork PRs too.
      - run: node scripts/check-plugin-contract.mjs

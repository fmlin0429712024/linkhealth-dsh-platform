name: Deploy LinkHealth VAS

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/e2e-smoke.sh'
      # docs-only changes never trigger a deploy (or the E2E gate).
      # NB: GitHub disallows combining `paths` with `paths-ignore`, so
      # exclusion is expressed with the `!` prefix inside `paths`.
      - '!**/*.md'
  workflow_dispatch: {}

jobs:
  # Pre-deploy gate: boot a real DSH headless profile with the plugins from
  # this checkout and run fixed LLM tasks (CDI rule, triage flow, guardrail).
  # If any fails, the release is not deployed. Needs the DeepSeek key, so this
  # runs only on same-repo pushes / manual dispatch — never on fork PRs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the dsh CLI
        run: npm install -g @deepseek-ai/dsh
      - name: Provision E2E home (credentials from the repo secret)
        run: |
          mkdir -p .dsh-e2e-home
          printf 'DEEPSEEK_API_KEY: %s\n' "${{ secrets.DEEPSEEK_API_KEY }}" > .dsh-e2e-home/.credentials.yaml
          chmod 600 .dsh-e2e-home/.credentials.yaml
      - name: E2E smoke (headless, real LLM)
        run: bash scripts/e2e-smoke.sh
        env:
          DSH_HOME: ${{ github.workspace }}/.dsh-e2e-home

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 must match the VM: the npm install below builds native deps
      # (sharp) against this runner's node/platform.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the deploy unit (self-contained profile + plugins)
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          mkdir -p dist/profile/plugins
          cp deploy/profile-linkhealth/package.json deploy/profile-linkhealth/cordis.patch.yml dist/profile/
          cp -r plugins/dsh-triage-plugin dist/profile/plugins/
          cp -r plugins/dsh-cdi-plugin dist/profile/plugins/
          cp -r plugins/dsh-vision-insights-plugin dist/profile/plugins/
          cp -r plugins/dsh-linkhealth-gui-plugin dist/profile/plugins/
          # Install dsh-vision-router + its deps (sharp, potrace, puppeteer-core,
          # undici) into the profile node_modules. Not saved to package.json —
          # the profile's bundles stay the stock dsh ones. Order matters: npm
          # install first, then the GUI symlink, so npm never prunes it.
          (cd dist/profile && npm install dsh-vision-router@1.2.2 --no-save --no-package-lock --no-audit --no-fund)
          # relative symlink — keeps the release directory self-contained
          ln -s ../plugins/dsh-linkhealth-gui-plugin dist/profile/node_modules/dsh-linkhealth-gui-plugin
          tar -czf "linkhealth-${SHA}.tar.gz" -C dist profile
          echo "release=linkhealth-${SHA}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload release to the VM
        run: |
          # DEPLOY_SSH_KEY is the base64 of the private key (single line — paste-safe)
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            "${{ env.release }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/linkhealth/incoming/"
          # deploy.sh is VM-side tooling — ship it with every deploy (idempotent,
          # so a freshly bootstrapped VM gets it without manual steps)
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            deploy/scripts/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/linkhealth/scripts/deploy.sh"

      - name: Deploy (unpack → wire cdi → switch symlink → restart → verify)
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo bash /opt/linkhealth/scripts/deploy.sh '${{ env.release }}' '${{ secrets.DEEPSEEK_API_KEY }}'"

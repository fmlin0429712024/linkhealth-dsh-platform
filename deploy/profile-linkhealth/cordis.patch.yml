# LinkHealth VAS profile — the deployable unit.
#
# Source of truth: github.com/fmlin0429712024/linkhealth-dsh-platform
# This is the CI/CD copy: paths are RELATIVE to the profile directory, so the
# whole release directory (profile + plugins) is self-contained and identical
# on every machine. Built by .github/workflows/deploy.yml from this repo's
# plugins/ tree.

# ── Intake triage (host: hub skill + spokes + guardrail backstop) ────────────
- insert:
    - id: linkhealth-intake-triage
      name: './plugins/dsh-triage-plugin/lib/index.js'
      config:
        logPath: 'data/triage_log.jsonl'

# ── CDI audit (host: deterministic SOP-rule tools + bundled stores/skills) ──
# bundledSkills: true — the release has no repo `.agents/skills` tree, so the
# plugin serves its own packaged skills snapshot.
- insert:
    - id: cdi-plugin
      name: './plugins/dsh-cdi-plugin/lib/index.js'
      config:
        bundledSkills: true

# ── LinkHealth Vision (host: assess_exercise_form, PT/rehab form check) ─────
# baseUrl points at the OpenVINO pose-estimation showcase VM
# (linkhealth-openvino-vision, 10.128.0.11:8080) — reachable from this
# profile's VM because both sit on the same VPC (default network,
# us-central1). See infra/openvino-vision/README.md.
- insert:
    - id: linkhealth-vision
      name: './plugins/dsh-vision-insights-plugin/lib/index.js'
      config:
        baseUrl: 'http://10.128.0.11:8080'

# ── dsh-vision-router (npm-installed at build time into profile/node_modules;
# see .github/workflows/deploy.yml "Build the deploy unit"): eyes for text-only
# models — built-in free vision chain (no key) + pixel-level vision tools
# (Q&A, grounding, crop, pixel diff, colors, OCR, SVG trace, cutout, screenshots)
# + a deepseek-vision twin route. Config editable later in Settings → 插件配置.
- insert:
    - id: vision-router
      name: 'dsh-vision-router'

# 放宽附件图片限制（dsh-vision-router 建议值：20MB / 1 亿像素），大图可过审。
- id: attachment-local
  config:
    maxImageBytes: 20971520
    maxImagePixels: 100000000

# ── LinkHealth Agents front door (client: brand theme + capability launcher) ─
# Loaded by name; the release build symlinks it into profile/node_modules.
- insert:
    - id: linkhealth-gui
      name: 'dsh-linkhealth-gui-plugin'
      config:
        headline: 'LinkHealth Agents'

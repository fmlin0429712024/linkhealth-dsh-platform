# The dsh-vision-plugin bundle patch.
#
# `lib/index.js` registers the `assess_exercise_form` tool (PT/rehab
# exercise-form check) against a vision backend reached via the `baseUrl`
# config entry below. The tool is registered unconditionally, but calling it
# without `baseUrl` set raises a clear configuration error — the endpoint is a
# deployment decision (only instance today: http://10.128.0.11:8080 on the GCP
# VPC, see infra/openvino-vision/README.md), so this default layer keeps
# `config: {}` and the wiring profile supplies the real value.
#
# Not yet wired into deploy/profile-linkhealth/cordis.patch.yml — separate
# decision once the plugin itself is solid.
#
# A DSH bundle is an npm package whose package.json declares
# `"dsh": { "bundle": { "patch": "./cordis.patch.yml" } }`. This patch layer
# is applied over the profile tree after the base layer (and any bundles that
# precede this one in `dsh.profile.bundles`), and before the profile's own
# `cordis.patch.yml`.

- insert:
    - id: linkhealth-vision
      name: 'dsh-vision-plugin'
      config: {}
